let LANG = localStorage.getItem("punchlist-lang-461") || "en";
let syncState = "connecting";

const KEY = "punchlist-461-anderson";
const API = "/api/state";
let synced = false;
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
// rev bumps the sync id so a reopened item starts unchecked again
const idOf = it => it.location + "::" + it.item + (it.rev ? "::r" + it.rev : "");
// Validation status ("validated" / "reopened") is set by Ray in the source, not in the UI
const applyStatus = () => DATA.forEach(it => { if (it.status === "validated") it.done = true; });
DATA.forEach(it => { it.done = !!saved[idOf(it)]; });
applyStatus();

const $ = s => document.querySelector(s);
const locSel = $("#fLoc"), catSel = $("#fCat");

const tLoc = l => LANG === "es" ? (TR.loc[l] || l) : l;
const tCat = c => LANG === "es" ? (TR.cat[c] || c) : c;
const tItem = it => (LANG === "es" && TR.items[it.num]) ? TR.items[it.num][0] : it.item;
const tNotes = it => (LANG === "es" && TR.items[it.num]) ? TR.items[it.num][1] : it.notes;

const locs = [...new Set(DATA.map(i => i.location))]
  .sort((a,b) => LOCATION_ORDER.indexOf(a) - LOCATION_ORDER.indexOf(b));
const cats = [...new Set(DATA.map(i => i.category))].sort();
locs.forEach(l => locSel.add(new Option(l, l)));
cats.forEach(c => catSel.add(new Option(c, c)));

function updateSyncNote() {
  const u = UI[LANG];
  $("#syncnote").textContent = syncState === "ok" ? u.syncOk : syncState === "off" ? u.syncOff : u.connecting;
}

function applyLang() {
  const u = UI[LANG];
  $("#sub").textContent = u.sub;
  $("#q").placeholder = u.search;
  $("#hideValLabel").textContent = u.hideValidated;
  $("#updatedLabel").textContent = u.updated;
  $("#langEn").classList.toggle("active", LANG === "en");
  $("#langEs").classList.toggle("active", LANG === "es");
  locSel.options[0].text = u.allLoc;
  catSel.options[0].text = u.allCat;
  for (let i = 1; i < locSel.options.length; i++) locSel.options[i].text = tLoc(locSel.options[i].value);
  for (let i = 1; i < catSel.options.length; i++) catSel.options[i].text = tCat(catSel.options[i].value);
  updateSyncNote();
  render();
}

function save() {
  const out = {};
  DATA.forEach(it => { if (it.done) out[idOf(it)] = 1; });
  localStorage.setItem(KEY, JSON.stringify(out));
}

async function loadRemote() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error("api " + r.status);
    const remote = await r.json();
    DATA.forEach(it => { it.done = !!remote[idOf(it)]; });
    applyStatus();
    synced = true;
    syncState = "ok";
    updateSyncNote();
    save();
    render();
  } catch (e) {
    synced = false;
    syncState = "off";
    updateSyncNote();
  }
}

async function pushRemote(it) {
  if (!synced) return;
  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: idOf(it), done: it.done }),
    });
  } catch (e) {
    synced = false;
    syncState = "off";
    updateSyncNote();
  }
}

function render() {
  const u = UI[LANG];
  const q = $("#q").value.trim().toLowerCase();
  const fl = locSel.value, fc = catSel.value, hv = $("#hideVal").checked;
  const list = $("#list");
  list.innerHTML = "";
  let shown = 0;

  locs.forEach(loc => {
    if (fl && loc !== fl) return;
    const items = DATA.filter(it =>
      it.location === loc &&
      (!fc || it.category === fc) &&
      (!hv || it.status !== "validated") &&
      (!q || (it.num + " " + it.item + " " + it.notes + " " + it.category + " " + tItem(it) + " " + tNotes(it) + " " + tLoc(it.location) + " " + tCat(it.category)).toLowerCase().includes(q))
    ).sort((a,b) => a.category.localeCompare(b.category));
    if (!items.length) return;

    const sec = document.createElement("section");
    sec.className = "loc";
    const doneCount = DATA.filter(i => i.location === loc && i.done).length;
    const total = DATA.filter(i => i.location === loc).length;
    sec.innerHTML = `<h2>${esc(tLoc(loc))} <span class="n">${doneCount}/${total} ${u.secDone}</span></h2>`;
    const card = document.createElement("div");
    card.className = "card";

    items.forEach(it => {
      shown++;
      const row = document.createElement("div");
      row.className = "row" + (it.done ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = it.done;
      cb.disabled = it.status === "validated";
      const body = document.createElement("div");
      body.className = "body";
      const notes = tNotes(it);
      const stBadge = it.status === "validated" ? `<span class="badge st-v">✓ ${u.badgeValidated}</span>`
                    : it.status === "reopened" ? `<span class="badge st-r">↻ ${u.badgeReopened}</span>` : "";
      body.innerHTML =
        `<div class="desc"><span class="num">${it.num}.</span> ${esc(tItem(it))}</div>` +
        (notes ? `<div class="notes">${esc(notes)}</div>` : "") +
        `<div class="meta"><span class="badge cat">${esc(tCat(it.category))}</span>${stBadge}</div>`;
      row.append(cb, body);
      const toggle = () => { if (it.status === "validated") return; it.done = !it.done; save(); pushRemote(it); render(); };
      cb.addEventListener("click", e => { e.stopPropagation(); toggle(); });
      row.addEventListener("click", e => { if (e.target !== cb) toggle(); });
      card.appendChild(row);
    });
    sec.appendChild(card);
    list.appendChild(sec);
  });

  if (!shown) list.innerHTML = `<div class="empty">${u.empty}</div>`;

  const done = DATA.filter(i => i.done).length;
  const validated = DATA.filter(i => i.status === "validated").length;
  $("#stats").innerHTML =
    `<span class="stat"><b>${DATA.length}</b> ${u.items}</span>` +
    `<span class="stat"><b>${DATA.length - done}</b> ${u.open}</span>` +
    `<span class="stat"><b>${done}</b> ${u.done}</span>` +
    `<span class="stat"><b>${validated}</b> ${u.validated}</span>` +
    `<span class="stat"><b>${locs.length}</b> ${u.locations}</span>`;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

["q","fLoc","fCat","hideVal"].forEach(id =>
  $("#" + id).addEventListener(id === "q" ? "input" : "change", render));
$("#langEn").addEventListener("click", () => { LANG = "en"; localStorage.setItem("punchlist-lang-461", "en"); applyLang(); });
$("#langEs").addEventListener("click", () => { LANG = "es"; localStorage.setItem("punchlist-lang-461", "es"); applyLang(); });
$("#updated").textContent = UPDATED;
applyLang();
loadRemote();
setInterval(loadRemote, 20000);
</script>
</body>
</html>
