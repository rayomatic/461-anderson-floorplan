  a { color: #0b57d0; }
  @media (prefers-color-scheme: dark) { a { color: #8ab4f8; } }
  .notes a { overflow-wrap: anywhere; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    background: var(--accent); color: var(--accent-ink);

  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  header .sub { opacity: .85; font-size: 13px; margin-top: 2px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .stat {

  .stat b { font-size: 14px; }
  .toolbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .toolbar select, .toolbar input[type=search] {
    font: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
  }
  .toolbar input[type=search] { flex: 1 1 140px; min-width: 120px; }
  .toolbar label.hide-done {
    font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center;
    user-select: none; cursor: pointer;
  }
  main { max-width: 780px; margin: 0 auto; padding: 14px 12px 60px; }
  section.loc { margin-bottom: 18px; }
  .loc h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 14px 4px 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .loc h2 .n { font-weight: normal; font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex; gap: 10px; padding: 11px 12px; align-items: flex-start;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .row:first-child { border-top: none; }
  .row input[type=checkbox] {
    width: 19px; height: 19px; margin: 2px 0 0; flex: none; accent-color: var(--done);
    cursor: pointer;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .desc { }
  .row .num { color: var(--muted); font-weight: 600; }
  .row .notes { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .row .meta { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .row .photos { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .row .photos img {
    height: 72px; width: 72px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--line); cursor: zoom-in;
  }
  .row .photos video {
    height: 130px; aspect-ratio: 9 / 16; width: auto; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line); background: #000;
  }
  .row.done .photos { opacity: .5; }
  .cmts { margin-top: 6px; }
  .cmt {
    font-size: 12.5px; background: var(--chip); border-radius: 8px;
    padding: 5px 9px; margin-top: 4px;
  }
  .cmt .cmt-d { color: var(--muted); font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .cmt-add {
    font: inherit; font-size: 12.5px; color: var(--accent); background: none;
    border: none; padding: 2px 0; cursor: pointer; margin-top: 4px; display: block;
  }
  .cmt-box { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
  .cmt-box textarea {
    flex: 1; font: inherit; font-size: 13px; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; background: var(--card); color: var(--ink);
    resize: vertical; min-height: 36px;
  }
  .cmt-box button {
    font: inherit; font-size: 13px; border: none; border-radius: 8px;
    padding: 7px 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .cmt-err { font-size: 12px; color: var(--reopen); margin-top: 3px; }
  .cmt-acts { margin-top: 2px; }
  .cmt-acts button {
    font: inherit; font-size: 11.5px; color: var(--accent); background: none;
    border: none; padding: 0; margin-right: 12px; cursor: pointer;
  }
  .cmt-rep {
    margin: 5px 0 0 12px; padding-left: 8px;
    border-left: 2px solid var(--line);
  }
  .row.done .cmts { text-decoration: none; opacity: .8; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: var(--chip); color: var(--muted); white-space: nowrap;
    border: 1px solid var(--line);
  }
  .badge.cat { color: var(--ink); font-weight: 600; }
  .badge.st-v { color: var(--ink); font-weight: 700; border-color: var(--ink); background: var(--card); }
  .badge.st-r { color: var(--bg); font-weight: 700; background: var(--ink); border-color: var(--ink); }
  .row.done .desc, .row.done .notes { text-decoration: line-through; opacity: .5; }
  .row.done .badge { opacity: .5; }
  .row.done .badge.st-v { opacity: 1; }
  .floor-h {
    font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--ink); margin: 26px 4px 0; padding-bottom: 5px;
    border-bottom: 2px solid var(--line);

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .total-open {
    text-align: right; font-weight: 600; font-size: 14px;

  }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }
  .print-rev { display: none; }
  @media print {
    /* Force a pure black-on-white palette regardless of screen/dark mode */
    :root {
      --bg: #fff; --card: #fff; --ink: #000; --muted: #333;
      --line: #999; --accent: #000; --accent-ink: #000;
      --done: #000; --chip: #fff; --reopen: #000;

    body { background: #fff; color: #000; font-size: 12px; }
    .toolbar, header .stats, .lang-toggle, .cmt-add, .cmt-box, .cmt-acts, #syncnote { display: none !important; }
    header { background: none; color: #000; border-bottom: 2px solid #000; padding: 0 0 8px; }
    header h1 { padding-right: 0; font-size: 17px; }
    header .sub { opacity: 1; color: #333; }
    main { max-width: none; padding: 8px 0 0; }
    .loc h2 { color: #000; }
    .floor-h { color: #000; border-bottom-color: #000; break-after: avoid; }
    .loc h2 .n { color: #000; }
    .card { border: 1px solid #999; border-radius: 0; background: #fff; }
    .row { break-inside: avoid; padding: 7px 8px; }
    .row .notes { color: #222; }
    .badge { background: #fff; border: 1px solid #000; color: #000; }
    .badge.cat { color: #000; }
    .badge.st-v { color: #000; }
    .badge.st-r { background: #000; color: #fff; border-color: #000; }
    .row.done .desc, .row.done .notes { opacity: .55; }
    .cmt { background: #fff; border: 1px solid #999; }
    .cmt .cmt-d { color: #333; }
    .row .photos img { border-color: #999; }
    .row .photos video { display: none; }
    .total-open { border-top: 2px solid #000; }
    footer { color: #000; text-align: left; padding: 10px 0 18px; }
    header, main, footer { filter: grayscale(100%); }
    /* position:fixed repeats on every printed page */
    .print-rev {
      display: block; position: fixed; bottom: 4px; right: 8px;
      font-size: 10px; color: #000; background: #fff; padding: 1px 4px;
    }
  }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .toolbar { padding: 9px 10px; }
    .toolbar select, .toolbar input[type=search] { font-size: 16px; padding: 9px 10px; }
    main { padding: 10px 8px 60px; }
    .row { padding: 13px 12px; gap: 12px; }
    .row input[type=checkbox] { width: 22px; height: 22px; }
    .row .notes { font-size: 13.5px; }
    .badge { font-size: 12px; padding: 3px 9px; }
    .cmt { font-size: 13.5px; }
    .cmt-add, .cmt-acts button { font-size: 13.5px; }
    .cmt-acts button { padding: 4px 0; }
    header h1 { font-size: 18px; }
    .lang-toggle button { padding: 10px 14px; }
  }

  header { position: relative; }
  header h1 { padding-right: 130px; }
  .lang-toggle {
    position: absolute; top: 16px; right: 16px; display: flex;
    border: 2px solid rgba(255,255,255,.75); border-radius: 999px; overflow: hidden;
  }
  .lang-toggle button {
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: .5px;
    background: transparent; color: var(--accent-ink); border: none;
    padding: 9px 16px; cursor: pointer;
  }
  .lang-toggle button.active { background: #ffffff; color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    .lang-toggle button.active { background: var(--accent-ink); color: var(--accent); }
  }
</style>

 {"num": 49, "location": "Garage", "category": "Electrical", "item": "Label all ethernet cables clearly", "notes": "Current labels: 1) office 1, 2) office 2, 3) office 3, 4) master room, 5) #3 Up, 6) #1, 7) #2, 8) TV Family Room, 9) 'Pacio Ciling', 10) Camera, 11) unlabeled. Clear so far: office 1-3, TV Family Room, Camera. Need definitions for: master room, #3 Up, #1, #2, 'Pacio Ciling' (patio ceiling?), and the unlabeled run. For office 1/2/3, also identify which wall each terminates on (north, west, south). Relabel everything with final names"},

 {"num": 65, "location": "Garage", "category": "Electrical", "item": "Install whole-home energy monitor (Leviton LWHEM-2R)", "notes": "LWHEM-2R delivered Tue May 13 - 2nd gen combines data hub + energy monitor. Mounts inside the load center; includes 1 pair of CTs (grid on Port 1; supports 2 more pairs for solar/battery later). Pair the existing smart breakers to it - verify breaker generation compatibility with Leviton (1-800-824-3005)", "status": "validated"},
 {"num": 71, "location": "Garage", "category": "Electrical", "item": "Re-feed the heat pump: standard 40A breaker in the panel + Siemens 30A GFCI outdoor disconnect at the condenser", "notes": "Fixes the GFCI nuisance tripping while keeping required GFCI protection on the circuit. Parts: Leviton LB240 standard 40A 2-pole for panel positions #44/46 (Home Depot); Siemens 30A GFCI breaker + enclosure (Amazon) mounts at the condenser as the outdoor disconnect. Verify the Mitsubishi nameplate before energizing: MCA 29 means 30A is the legal minimum - if it thermal-trips on hot-day defrost, upsize the Siemens GFCI to 40A (max breaker 48)"},
 {"num": 73, "location": "Garage", "category": "Electrical", "item": "In the subpanel, move the 50A smart breaker from the range to the hot tub circuit; install a new 30A smart breaker on the washer/dryer", "notes": "Range gets a standard breaker. Hot tub: 50A matches the spa spec; the spa's included GFCI subpanel provides the required GFCI protection. Buy 1x Leviton 2nd-gen 30A 2-pole smart breaker for the washer/dryer - note the washer and dryer were documented as separate 2-pole circuits (panel #10/12 and #30/32), so confirm which one gets it or order two"},
 {"num": 41, "location": "Garage", "category": "Electrical", "item": "Fix EV charger breaker tripping - upgrade to 50A AND diagnose instant trip", "notes": "Trips instantly at plug-in (not overload; same car+cable works fine at cousin's). 1) Verify GFCI breaker wiring: load neutral on breaker, pigtail to neutral bar, no neutral-ground contact downstream. 2) If wiring clean, suspect EVSE self-test vs GFCI breaker conflict - fix by hardwiring EVSE with standard non-GFCI breaker. Verify wire gauge is 6 AWG Cu before 50A swap. New breaker: Leviton #LB250-GFR (50A GFCI) arriving Mon Jul 27. Joe/Ivan messaged 7/25", "status": "validated"},

 es: {sub:"Agrupado por ubicación y luego por oficio", search:"Buscar elementos…", allLoc:"Todas las ubicaciones", allCat:"Todos los oficios", hideValidated:"Ocultar validados", items:"elementos", open:"pendientes", reopened:"reabiertos", done:"hechos", validated:"validados", locations:"ubicaciones", totalOpen:"Total de pendientes", floor1:"Primer piso", floor2:"Segundo piso", empty:"Ningún elemento coincide.", syncOk:"El progreso se sincroniza en todos los dispositivos.", syncOff:"Sincronización no disponible — el progreso se guarda solo en este dispositivo.", connecting:"Conectando…", updated:"Última actualización de la lista:", badgeValidated:"Validado", badgeReopened:"Reabierto", addComment:"Agregar comentario", cmtSave:"Guardar", cmtPh:"Escribe un comentario…", cmtErr:"No se pudo guardar - revisa la conexión e intenta de nuevo.", cmtEdit:"Editar", cmtReply:"Responder", cmtEdited:"editado", cmtDelete:"Eliminar", cmtConfirm:"¿Eliminar?"}
};

let LANG = localStorage.getItem("punchlist-lang-461") || "en";
let syncState = "connecting";

const KEY = "punchlist-461-anderson";
const API = "/api/state";
const CAPI = "/api/comments";
let COMMENTS = {};
let synced = false;
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
// rev bumps the sync id so a reopened item starts unchecked again
const idOf = it => it.location + "::" + it.item + (it.rev ? "::r" + it.rev : "");
// Validation status ("validated" / "reopened") is set by Ray in the source, not in the UI
const applyStatus = () => DATA.forEach(it => { if (it.status === "validated") it.done = true; });
DATA.forEach(it => { it.done = !!saved[idOf(it)]; });
applyStatus();

const $ = s => document.querySelector(s);
const locSel = $("#fLoc"), catSel = $("#fCat");

const tLoc = l => LANG === "es" ? (TR.loc[l] || l) : (LOC_EN[l] || l);
const tCat = c => LANG === "es" ? (TR.cat[c] || c) : c;
const tItem = it => (LANG === "es" && TR.items[it.num]) ? TR.items[it.num][0] : it.item;
const tNotes = it => (LANG === "es" && TR.items[it.num]) ? TR.items[it.num][1] : it.notes;

const locs = [...new Set(DATA.map(i => i.location))]
  .sort((a,b) => LOCATION_ORDER.indexOf(a) - LOCATION_ORDER.indexOf(b));
const cats = [...new Set(DATA.map(i => i.category))].sort();
locs.forEach(l => locSel.add(new Option(l, l)));
cats.forEach(c => catSel.add(new Option(c, c)));

function updateSyncNote() {
  const u = UI[LANG];
  $("#syncnote").textContent = syncState === "ok" ? u.syncOk : syncState === "off" ? u.syncOff : u.connecting;
}

function applyLang() {
  const u = UI[LANG];
  $("#sub").textContent = u.sub;
  $("#q").placeholder = u.search;
  $("#hideValLabel").textContent = u.hideValidated;
  $("#updatedLabel").textContent = u.updated;
  $("#langEn").classList.toggle("active", LANG === "en");
  $("#langEs").classList.toggle("active", LANG === "es");
  locSel.options[0].text = u.allLoc;
  catSel.options[0].text = u.allCat;
  for (let i = 1; i < locSel.options.length; i++) locSel.options[i].text = tLoc(locSel.options[i].value);
  for (let i = 1; i < catSel.options.length; i++) catSel.options[i].text = tCat(catSel.options[i].value);
  updateSyncNote();
  render();
}

function save() {
  const out = {};
  DATA.forEach(it => { if (it.done) out[idOf(it)] = 1; });
  localStorage.setItem(KEY, JSON.stringify(out));
}

let lastSig = null;
async function loadRemote() {
  try {
    const [r, rc] = await Promise.all([fetch(API), fetch(CAPI)]);
    if (!r.ok) throw new Error("api " + r.status);
    const remote = await r.json();
    const comments = rc.ok ? await rc.json() : COMMENTS;
    synced = true;
    syncState = "ok";
    updateSyncNote();
    // nothing changed since the last poll: leave the DOM alone (prevents scroll jumps)
    const sig = JSON.stringify(remote) + "|" + JSON.stringify(comments);
    if (sig === lastSig) return;
    lastSig = sig;
    COMMENTS = comments;
    DATA.forEach(it => { it.done = !!remote[idOf(it)]; });
    applyStatus();
    save();
    patchFromSync();
  } catch (e) {
    synced = false;
    syncState = "off";
    updateSyncNote();
  }
}

function fmtCmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(LANG === "es" ? "es-MX" : "en-US",
    { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

async function postComment(payload) {
  const r = await fetch(CAPI, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!r.ok) throw new Error("api " + r.status);
  COMMENTS = await r.json();
}

// Inline composer: textarea + save button; onSave(text) should throw on failure
function cmtComposer(u, initial, onSave) {
  const box = document.createElement("div");
  box.className = "cmt-box";
  const ta = document.createElement("textarea");
  ta.placeholder = u.cmtPh;
  if (initial) ta.value = initial;
  const btn = document.createElement("button");
  btn.textContent = u.cmtSave;
  btn.addEventListener("click", async e => {
    e.stopPropagation();
    const text = ta.value.trim();
    if (!text) return;
    btn.disabled = true;
    try {
      await onSave(text);
      box.remove();
      patchFromSync();
    } catch (err) {
      btn.disabled = false;
      if (!box.querySelector(".cmt-err")) {
        const msg = document.createElement("div");
        msg.className = "cmt-err";
        msg.textContent = u.cmtErr;
        box.appendChild(msg);
      }
    }
  });
  box.append(ta, btn);
  return { box, ta };
}

function cmtActBtn(label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.addEventListener("click", e => { e.stopPropagation(); fn(); });
  return b;
}

// Two-tap delete: first tap arms ("Delete?"), second tap within 3s deletes
function cmtDelBtn(u, payload) {
  const b = document.createElement("button");
  let armed = false, timer;
  b.textContent = u.cmtDelete;
  b.addEventListener("click", async e => {
    e.stopPropagation();
    if (!armed) {
      armed = true;
      b.textContent = u.cmtConfirm;
      b.style.color = "var(--reopen)";
      timer = setTimeout(() => { armed = false; b.textContent = u.cmtDelete; b.style.color = ""; }, 3000);
      return;
    }
    clearTimeout(timer);
    b.disabled = true;
    try { await postComment(payload); patchFromSync(); } catch (err) { b.disabled = false; }
  });
  return b;
}

function cmtLine(prefix, c, u) {
  const line = document.createElement("div");
  line.className = "cmt-line";
  line.textContent = prefix + c.text + " ";
  const dt = document.createElement("span");
  dt.className = "cmt-d";
  dt.textContent = fmtCmtDate(c.at) + (c.edited ? " · " + u.cmtEdited : "");
  line.appendChild(dt);
  return line;
}

function buildComments(it, u) {
  const wrap = document.createElement("div");
  wrap.className = "cmts";

  (COMMENTS[it.num] || []).forEach((c, idx) => {
    const d = document.createElement("div");
    d.className = "cmt";
    const line = cmtLine("💬 ", c, u);
    d.appendChild(line);

    const acts = document.createElement("div");
    acts.className = "cmt-acts";
    acts.appendChild(cmtActBtn(u.cmtEdit, () => {
      const { box, ta } = cmtComposer(u, c.text, text =>
        postComment({ op: "edit", num: it.num, idx, text }));
      d.replaceChild(box, line);
      acts.remove();
      ta.focus();
    }));
    acts.appendChild(cmtActBtn(u.cmtReply, () => {
      const { box, ta } = cmtComposer(u, "", text =>
        postComment({ op: "reply", num: it.num, idx, text }));
      d.insertBefore(box, acts);
      ta.focus();
    }));
    acts.appendChild(cmtDelBtn(u, { op: "delete", num: it.num, idx }));

    (c.replies || []).forEach((r, ridx) => {
      const rd = document.createElement("div");
      rd.className = "cmt-rep";
      const rline = cmtLine("↳ ", r, u);
      rd.appendChild(rline);
      const racts = document.createElement("div");
      racts.className = "cmt-acts";
      racts.appendChild(cmtActBtn(u.cmtEdit, () => {
        const { box, ta } = cmtComposer(u, r.text, text =>
          postComment({ op: "edit", num: it.num, idx, ridx, text }));
        rd.replaceChild(box, rline);
        racts.remove();
        ta.focus();
      }));
      racts.appendChild(cmtDelBtn(u, { op: "delete", num: it.num, idx, ridx }));
      rd.appendChild(racts);
      d.appendChild(rd);
    });

    d.appendChild(acts);
    wrap.appendChild(d);
  });

  const add = document.createElement("button");
  add.className = "cmt-add";
  add.textContent = "💬 " + u.addComment;
  add.addEventListener("click", e => {
    e.stopPropagation();
    const { box, ta } = cmtComposer(u, "", text =>
      postComment({ op: "add", num: it.num, text }));
    wrap.replaceChild(box, add);
    ta.focus();
  });
  wrap.appendChild(add);
  return wrap;
}

async function pushRemote(it) {
  if (!synced) return;
  try {
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: idOf(it), done: it.done }),
    });
  } catch (e) {
    synced = false;
    syncState = "off";
    updateSyncNote();
  }
}

function openLabel(loc, u) {
  const openHere = DATA.filter(i => i.location === loc && !i.done);
  const byCat = {};
  openHere.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + 1; });
  return openHere.length
    ? Object.entries(byCat).map(([c, n]) => `${n} ${esc(tCat(c))}`).join(" · ") + ` ${u.open}`
    : `0 ${u.open}`;
}

function updateCounts() {
  const u = UI[LANG];
  document.querySelectorAll("#list section.loc").forEach(sec => {
    const n = sec.querySelector("h2 .n");
    if (n && sec.dataset.loc) n.innerHTML = openLabel(sec.dataset.loc, u);
  });
  const t = document.querySelector("#list .total-open");
  if (t) t.textContent = `${u.totalOpen}: ${DATA.filter(i => !i.done).length}`;
  updateCounts();
}

// Update existing rows in place - never rebuilds the DOM, so media elements
// (and your scroll position) are left alone.
function patchFromSync() {
  const u = UI[LANG];
  document.querySelectorAll("#list .row").forEach(row => {
    const it = DATA.find(d => d.num === +row.dataset.num);
    if (!it) return;
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb && cb.checked !== it.done) cb.checked = it.done;
    row.classList.toggle("done", !!it.done);
    const sig = JSON.stringify(COMMENTS[it.num] || []);
    if (row._cmtSig !== sig) {
      const cmts = row.querySelector(".cmts");
      if (cmts && !cmts.querySelector(".cmt-box")) {
        cmts.replaceWith(buildComments(it, u));
        row._cmtSig = sig;
      }
    }
  });
  updateCounts();
}

function render() {
  const u = UI[LANG];
  const q = $("#q").value.trim().toLowerCase();
  const fl = locSel.value, fc = catSel.value, hv = $("#hideVal").checked;
  const list = $("#list");
  list.innerHTML = "";
  let shown = 0;
  let lastFloor = null;

  locs.forEach(loc => {
    if (fl && loc !== fl) return;
    const items = DATA.filter(it =>
      it.location === loc &&
      (!fc || it.category === fc) &&
      (!hv || it.status !== "validated") &&
      (!q || (it.num + " " + it.item + " " + it.notes + " " + it.category + " " + tItem(it) + " " + tNotes(it) + " " + tLoc(it.location) + " " + tCat(it.category)).toLowerCase().includes(q))
    ).sort((a,b) => a.category.localeCompare(b.category));
    if (!items.length) return;

    const floor = FLOOR_OF[loc] || null;
    if (floor && floor !== lastFloor) {
      const fh = document.createElement("h2");
      fh.className = "floor-h";
      fh.textContent = u[floor];
      list.appendChild(fh);
    }
    lastFloor = floor;

    const sec = document.createElement("section");
    sec.className = "loc";
    sec.dataset.loc = loc;
    sec.innerHTML = `<h2>${esc(tLoc(loc))} <span class="n">${openLabel(loc, u)}</span></h2>`;
    const card = document.createElement("div");
    card.className = "card";

    items.forEach(it => {
      shown++;
      const row = document.createElement("div");
      row.className = "row" + (it.done ? " done" : "");
      row.dataset.num = it.num;
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = it.done;
      cb.disabled = it.status === "validated";
      const body = document.createElement("div");
      body.className = "body";
      const notes = tNotes(it);
      const stBadge = it.status === "validated" ? `<span class="badge st-v">✓ ${u.badgeValidated}</span>`
                    : it.status === "reopened" ? `<span class="badge st-r">↻ ${u.badgeReopened}</span>` : "";
      const photos = (it.photos || []).map(p =>
        p.endsWith(".mp4")
          ? `<video src="${p}" controls playsinline preload="metadata"></video>`
          : `<a href="${p}" target="_blank" rel="noopener"><img src="${p}" alt="" loading="lazy"></a>`).join("");
      body.innerHTML =
        `<div class="desc"><span class="num">${it.num}.</span> ${esc(tItem(it))}</div>` +
        (notes ? `<div class="notes">${linkify(esc(notes))}</div>` : "") +
        (photos ? `<div class="photos">${photos}</div>` : "") +
        `<div class="meta"><span class="badge cat">${esc(tCat(it.category))}</span>${stBadge}</div>`;
      body.appendChild(buildComments(it, u));
      row._cmtSig = JSON.stringify(COMMENTS[it.num] || []);
      row.append(cb, body);
      const toggle = () => { if (it.status === "validated") return; it.done = !it.done; save(); pushRemote(it); patchFromSync(); };
      cb.addEventListener("click", e => { e.stopPropagation(); toggle(); });
      row.addEventListener("click", e => { if (e.target !== cb && !e.target.closest("a, video, .cmts")) toggle(); });
      card.appendChild(row);
    });
    sec.appendChild(card);
    list.appendChild(sec);
  });

  if (!shown) list.innerHTML = `<div class="empty">${u.empty}</div>`;
  else {
    const totalOpen = DATA.filter(i => !i.done).length;
    list.insertAdjacentHTML("beforeend", `<div class="total-open">${u.totalOpen}: ${totalOpen}</div>`);
  }

  updateCounts();
}

function linkify(t) {
  return t.replace(/(https?:\/\/[^\s<]+|(?:[a-zA-Z0-9-]+\.)+(?:com|net|org|app)(?:\/[^\s<,;)]*)?)/g, m => {
    const href = m.startsWith("http") ? m : "https://" + m;
    return `<a href="${href}" target="_blank" rel="noopener">${m}</a>`;
  });
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
